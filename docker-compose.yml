services:
  db:
    image: postgres:15
    container_name: db
    restart: always
    networks:
      - my_network
    env_file:
      - ${MODE}.env
    environment:
      POSTGRES_DB: claim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "claim"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s


  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_app
    restart: always
    networks:
      - my_network
#    extra_hosts:
#      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ${MODE}.env
    expose:
      - "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./src/media:/app/src/media  # ✅ 로컬과 도커 내부의 media 디렉토리를 공유
    entrypoint: sh /app/src/scripts/entrypoint.sh  # 🔄 entrypoint로 교체
    environment:
      - CRAWLER_API_URL=http://host.docker.internal:5001
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://backend/health"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    networks:
      - my_network
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    networks:
      - my_network
    ports:
      - "6379:6379"

volumes:
  postgres_data:


networks:
  my_network:
    driver: bridge